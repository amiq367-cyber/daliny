<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>دليني</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a7f8f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دليني">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root {
    --bg: #ffffff;
    --fg: #14232b;
    --muted: #5d6f78;
    --line: #dbe4e8;
    --accent: #0a7f8f;
    --accent-fg: #ffffff;
    --danger: #c92a2a;
    --shadow: 0 4px 18px rgba(10, 40, 50, .22);
    --font: 'Tajawal', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  }
  html.dark {
    --bg: #172228;
    --fg: #e8f1f4;
    --muted: #9bb0b9;
    --line: #2b3b43;
    --accent: #2fc0d3;
    --accent-fg: #06262c;
    --danger: #ff6b6b;
    --shadow: 0 4px 18px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  #map { position: fixed; inset: 0; z-index: 0; background: #e6ecef; }
  html.dark #map { background: #10181c; }
  html.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.9); }
  button { font-family: inherit; font-size: 1rem; cursor: pointer; border: 0; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- شريط البحث ---------- */
  .top {
    position: fixed; z-index: 1000;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    right: max(10px, env(safe-area-inset-right, 0px));
    left: max(10px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; gap: 6px;
  }
  .searchbox {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg); border-radius: 14px; box-shadow: var(--shadow);
    padding: 4px 6px 4px 4px;
  }
  .searchbox input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg);
    font-family: inherit; font-size: 1.05rem; padding: 12px 10px; outline: none;
  }
  .searchbox input::placeholder { color: var(--muted); }
  .searchbox button {
    background: var(--accent); color: var(--accent-fg); border-radius: 10px;
    padding: 10px 16px; font-weight: 700;
  }
  .results {
    background: var(--bg); border-radius: 14px; box-shadow: var(--shadow);
    max-height: 40vh; overflow-y: auto; margin: 0; padding: 4px; list-style: none;
  }
  .results li {
    padding: 11px 12px; border-radius: 10px; cursor: pointer; line-height: 1.5;
    border-bottom: 1px solid var(--line);
  }
  .results li:last-child { border-bottom: 0; }
  .results li:active { background: var(--line); }
  .results small { display: block; color: var(--muted); }

  /* ---------- لافتة الملاحة ---------- */
  .nav {
    position: fixed; z-index: 1001;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    right: max(10px, env(safe-area-inset-right, 0px));
    left: max(10px, env(safe-area-inset-left, 0px));
    background: var(--accent); color: var(--accent-fg);
    border-radius: 16px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  }
  .nav .turn { width: 54px; height: 54px; flex: none; display: grid; place-items: center; }
  .nav .turn svg { width: 46px; height: 46px; transition: transform .25s; }
  .nav .ntext { flex: 1; min-width: 0; }
  .nav .big { font-size: 1.9rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .nav #navText { font-size: 1.05rem; line-height: 1.35; opacity: .95; }
  .nav .speed { text-align: center; border-right: 1px solid rgba(255,255,255,.35); padding-right: 12px; flex: none; }
  .nav .speed b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1; }
  .nav .speed small { font-size: .75rem; opacity: .9; }

  /* ---------- الأسفل ---------- */
  .bottom {
    position: fixed; z-index: 1000; pointer-events: none;
    bottom: 0;
    right: max(10px, env(safe-area-inset-right, 0px));
    left: max(10px, env(safe-area-inset-left, 0px));
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    display: flex; flex-direction: column; gap: 10px;
  }
  .bottom > * { pointer-events: auto; }
  .fabs { display: flex; flex-direction: column; gap: 10px; align-self: flex-start; }
  .fab {
    width: 52px; height: 52px; border-radius: 50%; background: var(--bg);
    box-shadow: var(--shadow); display: grid; place-items: center; color: var(--fg);
  }
  .fab svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fab.on { background: var(--accent); color: var(--accent-fg); }
  .fab.warn { color: var(--danger); }

  .panel, .sheet {
    background: var(--bg); border-radius: 18px; box-shadow: var(--shadow); padding: 14px;
  }
  .panel h3 { margin: 0 0 10px; font-size: 1rem; }
  .hz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .hz-grid button {
    background: var(--line); border-radius: 12px; padding: 12px 8px;
    display: flex; align-items: center; gap: 8px; justify-content: center; font-weight: 500;
  }
  .hz-grid i {
    width: 26px; height: 26px; border-radius: 50%; color: #fff; font-style: normal;
    display: grid; place-items: center; font-weight: 800; font-size: .9rem; flex: none;
  }

  .sheet .dest { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
  .sheet .sum { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; color: var(--muted); }
  .sheet .sum b { font-size: 1.6rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .actions button { padding: 12px 16px; border-radius: 12px; background: var(--line); font-weight: 700; }
  .actions .primary { background: var(--accent); color: var(--accent-fg); flex: 1 1 140px; }
  .actions .danger { background: var(--danger); color: #fff; flex: 1 1 140px; }

  /* شريط مصغّر أثناء الملاحة */
  .sheet.navmode {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 12px; border-radius: 16px;
  }
  .sheet.navmode .dest, .sheet.navmode #stepsBox { display: none; }
  .sheet.navmode .sum { flex: 1; min-width: 0; flex-wrap: wrap; gap: 0 10px; align-items: baseline; font-size: .9rem; }
  .sheet.navmode .sum b { font-size: 1.35rem; }
  .sheet.navmode .actions { margin-top: 0; flex-wrap: nowrap; flex: none; }
  .sheet.navmode .actions button { padding: 9px 13px; flex: none; }
  .sheet.navmode .actions .danger { flex: none; }
  #voiceBtn.off { text-decoration: line-through; opacity: .6; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); padding: 4px 0; }
  ol.steps { margin: 6px 0 0; padding: 0 22px 0 0; max-height: 28vh; overflow-y: auto; line-height: 1.6; }
  ol.steps li { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  ol.steps small { color: var(--muted); margin-right: 6px; }

  #toast {
    position: fixed; z-index: 2000; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 84px);
    background: #14232b; color: #fff; padding: 10px 16px; border-radius: 12px;
    max-width: 90vw; text-align: center; box-shadow: var(--shadow);
  }

  /* ---------- علامات الخريطة ---------- */
  .me { position: relative; width: 30px; height: 30px; }
  .me .halo { position: absolute; inset: 0; border-radius: 50%; background: rgba(10,127,143,.25); }
  .me .dot {
    position: absolute; inset: 7px; border-radius: 50%; background: #0a7f8f;
    border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.4);
  }
  .me i { position: absolute; inset: 0; transition: transform .3s; }
  .me i::before {
    content: ""; position: absolute; top: -7px; left: 9px;
    border: 6px solid transparent; border-bottom: 9px solid #0a7f8f; border-top: 0;
  }
  .hz {
    width: 30px; height: 30px; border-radius: 50%; color: #fff; display: grid; place-items: center;
    font-weight: 800; border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.45); font-family: var(--font);
  }
  .flag {
    width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: var(--danger); border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.45);
  }
  .leaflet-popup-content { font-family: var(--font); text-align: center; }
  .leaflet-popup-content button {
    background: #0a7f8f; color: #fff; border-radius: 10px; padding: 9px 14px; font-weight: 700; margin-top: 4px;
  }
  .leaflet-control-attribution { font-size: 10px; }
  .leaflet-control-zoom { display: none; }
</style>
</head>
<body>

<div id="map"></div>

<!-- البحث -->
<div class="top" id="top">
  <form class="searchbox" id="searchForm">
    <input id="q" type="search" placeholder="وين تريد تروح؟" autocomplete="off" enterkeyhint="search">
    <button type="submit">ابحث</button>
  </form>
  <ul class="results" id="results" hidden></ul>
</div>

<!-- لافتة الملاحة -->
<header class="nav" id="nav" hidden>
  <div class="turn">
    <svg id="navArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M6 11l6-6 6 6"/></svg>
  </div>
  <div class="ntext">
    <div class="big" id="navDist">—</div>
    <div id="navText">—</div>
  </div>
  <div class="speed"><b id="spd">0</b><small>كم/س</small></div>
</header>

<div class="bottom">
  <div class="fabs">
    <button class="fab" id="btnLocate" aria-label="موقعي">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="fab warn" id="btnReport" aria-label="بلّغ عن شي بالطريق">
      <svg viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v5M12 17.5v.01"/></svg>
    </button>
    <button class="fab" id="btnTheme" aria-label="الوضع الليلي">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
  </div>

  <div class="panel" id="reportPanel" hidden>
    <h3>شنو شفت بالطريق؟ (يوصل لكل المستخدمين)</h3>
    <div class="hz-grid" id="hzGrid"></div>
  </div>

  <section class="sheet" id="sheet" hidden>
    <div class="dest" id="destName"></div>
    <div class="sum"><b id="sumTime">—</b><span id="sumDist"></span><span id="sumEta"></span></div>
    <div class="actions" id="planActions">
      <button class="primary" id="startBtn">ابدأ الملاحة</button>
      <button id="simBtn">تجربة بدون تحرك</button>
      <button id="cancelBtn">إلغاء</button>
    </div>
    <div class="actions" id="navActions" hidden>
      <button id="voiceBtn">صوت</button>
      <button class="danger" id="endBtn">إنهاء</button>
    </div>
    <details id="stepsBox">
      <summary>خطوات الطريق</summary>
      <ol class="steps" id="steps"></ol>
    </details>
  </section>
</div>

<div id="toast" hidden></div>

<script>
(function () {
  'use strict';

  /* ================= أدوات مساعدة ================= */
  const $ = (id) => document.getElementById(id);
  const state = {
    user: null, follow: false, watchId: null,
    dest: null, route: null, coords: [],
    navigating: false, stepIdx: 0, offCount: 0, rerouting: false,
    sim: null, voice: true, wake: null
  };

  function toast(msg, ms) {
    const t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.hidden = true; }, ms || 2800);
  }
  function fmtDist(m) {
    if (m < 1000) return Math.max(10, Math.round(m / 10) * 10) + ' م';
    return (m / 1000).toFixed(m < 10000 ? 1 : 0) + ' كم';
  }
  function fmtTime(s) {
    const mins = Math.max(1, Math.round(s / 60));
    if (mins < 60) return mins + ' دقيقة';
    const h = Math.floor(mins / 60), r = mins % 60;
    return h + ' ساعة' + (r ? ' و ' + r + ' دقيقة' : '');
  }
  function fmtClock(secFromNow) {
    const d = new Date(Date.now() + secFromNow * 1000);
    return d.toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' });
  }
  function haversine(a, b) { // [lat,lng] , [lat,lng] -> متر
    const R = 6371000, r = Math.PI / 180;
    const dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function segDist(p, a, b) { // مسافة نقطة عن قطعة مستقيمة بالمتر
    const k = Math.cos(p[0] * Math.PI / 180);
    const px = p[1] * k, py = p[0], ax = a[1] * k, ay = a[0], bx = b[1] * k, by = b[0];
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy)) * 111320;
  }
  function distToRoute(p) {
    const c = state.coords;
    let best = Infinity;
    for (let i = 0; i < c.length - 1; i++) {
      const d = segDist(p, c[i], c[i + 1]);
      if (d < best) best = d;
    }
    return best;
  }
  function bearing(a, b) {
    const r = Math.PI / 180;
    const y = Math.sin((b[1] - a[1]) * r) * Math.cos(b[0] * r);
    const x = Math.cos(a[0] * r) * Math.sin(b[0] * r) - Math.sin(a[0] * r) * Math.cos(b[0] * r) * Math.cos((b[1] - a[1]) * r);
    return (Math.atan2(y, x) / r + 360) % 360;
  }

  /* ================= الخريطة ================= */
  const map = L.map('map', { zoomControl: false, tap: true }).setView([33.3152, 44.3661], 13);

  const lightTiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  });
  lightTiles.addTo(map);

  let dark = false;
  try {
    const saved = localStorage.getItem('khareetati-dark');
    dark = saved === null ? window.matchMedia('(prefers-color-scheme: dark)').matches : saved === '1';
  } catch (e) {}
  function applyTheme() {
    document.documentElement.classList.toggle('dark', dark);
    $('btnTheme').classList.toggle('on', dark);
  }
  applyTheme();
  $('btnTheme').onclick = () => {
    dark = !dark;
    try { localStorage.setItem('khareetati-dark', dark ? '1' : '0'); } catch (e) {}
    applyTheme();
  };

  map.on('dragstart', () => { state.follow = false; $('btnLocate').classList.remove('on'); });

  /* ================= موقعي ================= */
  const meIcon = L.divIcon({
    className: '', iconSize: [30, 30], iconAnchor: [15, 15],
    html: '<div class="me"><div class="halo"></div><i></i><div class="dot"></div></div>'
  });
  let meMarker = null;

  function setUser(lat, lng, heading, speed) {
    state.user = { lat, lng, heading: heading, speed: speed };
    if (!meMarker) meMarker = L.marker([lat, lng], { icon: meIcon, interactive: false, zIndexOffset: 1000 }).addTo(map);
    else meMarker.setLatLng([lat, lng]);
    const el = meMarker.getElement();
    if (el && typeof heading === 'number' && !isNaN(heading)) {
      const arrow = el.querySelector('i');
      if (arrow) arrow.style.transform = 'rotate(' + heading + 'deg)';
    }
    if (state.follow) map.panTo([lat, lng], { animate: true, duration: 0.4 });
  }

  function onPosition(lat, lng, heading, speedMs) {
    setUser(lat, lng, heading, speedMs);
    if (state.navigating) navUpdate();
  }

  function startWatch() {
    if (state.watchId !== null) return;
    if (!navigator.geolocation) { toast('جهازك ما يدعم تحديد الموقع'); return; }
    state.watchId = navigator.geolocation.watchPosition(
      (pos) => {
        if (state.sim) return; // أثناء التجربة نتجاهل الـ GPS الحقيقي
        const c = pos.coords;
        onPosition(c.latitude, c.longitude, c.heading, c.speed);
      },
      (err) => {
        state.watchId = null;
        toast(err.code === 1 ? 'اسمح للمتصفح باستخدام موقعك' : 'ما كدرت أحدد موقعك', 4000);
      },
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
    );
  }

  $('btnLocate').onclick = () => {
    state.follow = true;
    $('btnLocate').classList.add('on');
    if (state.user) map.setView([state.user.lat, state.user.lng], Math.max(map.getZoom(), 16));
    else toast('جاري تحديد موقعك...');
    startWatch();
  };

  /* ================= البحث ================= */
  const resultsEl = $('results');
  function hideResults() { resultsEl.hidden = true; resultsEl.innerHTML = ''; }

  async function nominatim(q, iraqOnly) {
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=ar&q=' +
      encodeURIComponent(q) + (iraqOnly ? '&countrycodes=iq' : '');
    const r = await fetch(url);
    if (!r.ok) throw new Error('search');
    return r.json();
  }

  $('searchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = $('q').value.trim();
    if (!q) return;
    $('q').blur();
    resultsEl.hidden = false;
    resultsEl.innerHTML = '<li>جاري البحث...</li>';
    try {
      let data = await nominatim(q, true);
      if (!data.length) data = await nominatim(q, false);
      if (!data.length) { resultsEl.innerHTML = '<li>ما لقيت شي. جرّب اسم ثاني أو اسم المنطقة.</li>'; return; }
      resultsEl.innerHTML = '';
      data.forEach((it) => {
        const parts = (it.display_name || '').split('،');
        const li = document.createElement('li');
        const b = document.createElement('b'); b.textContent = it.name || parts[0];
        const s = document.createElement('small'); s.textContent = parts.slice(1, 4).join('،');
        li.append(b, s);
        li.onclick = () => {
          hideResults();
          chooseDest({ lat: parseFloat(it.lat), lng: parseFloat(it.lon), name: it.name || parts[0] });
        };
        resultsEl.appendChild(li);
      });
    } catch (err) {
      resultsEl.innerHTML = '<li>صار خلل بالبحث. تأكد من الإنترنت وجرّب مرة ثانية.</li>';
    }
  });

  // الضغط على الخريطة
  map.on('click', (e) => {
    hideResults();
    $('reportPanel').hidden = true;
    if (state.navigating) return;
    const html = document.createElement('div');
    const btn = document.createElement('button');
    btn.textContent = 'اذهب إلى هنا';
    html.appendChild(btn);
    const pop = L.popup({ closeButton: false }).setLatLng(e.latlng).setContent(html).openOn(map);
    btn.onclick = () => {
      map.closePopup(pop);
      chooseDest({ lat: e.latlng.lat, lng: e.latlng.lng, name: 'نقطة على الخريطة' });
    };
  });

  /* ================= الوجهة والمسار ================= */
  let destMarker = null, routeCasing = null, routeLine = null;

  function chooseDest(d) {
    state.dest = d;
    if (destMarker) map.removeLayer(destMarker);
    destMarker = L.marker([d.lat, d.lng], {
      icon: L.divIcon({ className: '', iconSize: [34, 34], iconAnchor: [4, 34], html: '<div class="flag"></div>' })
    }).addTo(map);
    planRoute();
  }

  async function fetchRoute(from, to) {
    const url = 'https://router.project-osrm.org/route/v1/driving/' +
      from[1] + ',' + from[0] + ';' + to[1] + ',' + to[0] +
      '?overview=full&geometries=geojson&steps=true';
    const r = await fetch(url);
    if (!r.ok) throw new Error('route');
    const j = await r.json();
    if (j.code !== 'Ok' || !j.routes.length) throw new Error('noroute');
    return j.routes[0];
  }

  function drawRoute(route) {
    state.route = route;
    state.coords = route.geometry.coordinates.map((c) => [c[1], c[0]]);
    if (routeCasing) map.removeLayer(routeCasing);
    if (routeLine) map.removeLayer(routeLine);
    routeCasing = L.polyline(state.coords, { color: '#ffffff', weight: 11, opacity: .95, lineCap: 'round' }).addTo(map);
    routeLine = L.polyline(state.coords, { color: '#0a7f8f', weight: 6, opacity: 1, lineCap: 'round' }).addTo(map);
  }

  function renderSheet() {
    const r = state.route;
    $('sheet').hidden = false;
    $('destName').textContent = state.dest ? state.dest.name : '';
    $('sumTime').textContent = fmtTime(r.duration);
    $('sumDist').textContent = fmtDist(r.distance);
    $('sumEta').textContent = 'الوصول ' + fmtClock(r.duration);
    const ol = $('steps'); ol.innerHTML = '';
    r.legs[0].steps.forEach((s) => {
      const li = document.createElement('li');
      li.textContent = arInstr(s);
      if (s.distance > 0) { const sm = document.createElement('small'); sm.textContent = fmtDist(s.distance); li.appendChild(sm); }
      ol.appendChild(li);
    });
  }

  async function planRoute() {
    let from;
    if (state.user) from = [state.user.lat, state.user.lng];
    else { const c = map.getCenter(); from = [c.lat, c.lng]; toast('ما اكو موقعك الحالي، المسار من مركز الخريطة'); }
    toast('جاري حساب الطريق...');
    try {
      const route = await fetchRoute(from, [state.dest.lat, state.dest.lng]);
      drawRoute(route);
      renderSheet();
      $('planActions').hidden = false;
      $('navActions').hidden = true;
      $('top').hidden = false;
      map.fitBounds(routeLine.getBounds(), { paddingTopLeft: [30, 120], paddingBottomRight: [30, 260] });
    } catch (e) {
      toast('ما كدرت ألقى طريق لهذا المكان', 4000);
    }
  }

  function clearRoute() {
    if (routeCasing) map.removeLayer(routeCasing);
    if (routeLine) map.removeLayer(routeLine);
    if (destMarker) map.removeLayer(destMarker);
    routeCasing = routeLine = destMarker = null;
    state.route = null; state.coords = []; state.dest = null;
    $('sheet').hidden = true;
  }

  /* ================= تعليمات عربية ================= */
  const DIR = {
    'right': 'يميناً', 'left': 'يساراً',
    'slight right': 'قليلاً يميناً', 'slight left': 'قليلاً يساراً',
    'sharp right': 'بحدة يميناً', 'sharp left': 'بحدة يساراً'
  };
  const ROT = { 'straight': 0, 'slight right': 45, 'right': 90, 'sharp right': 135, 'uturn': 180,
                'sharp left': -135, 'left': -90, 'slight left': -45 };

  function arInstr(s) {
    const m = s.maneuver, t = m.type, mod = m.modifier;
    const name = s.name ? ' إلى ' + s.name : '';
    if (t === 'depart') return 'انطلق' + (s.name ? ' على ' + s.name : '');
    if (t === 'arrive') return 'وصلت إلى وجهتك';
    if (t === 'roundabout' || t === 'rotary' || t === 'roundabout turn')
      return 'ادخل الدوّار وخذ المخرج رقم ' + (m.exit || 1) + name;
    if (t === 'exit roundabout' || t === 'exit rotary') return 'اخرج من الدوّار' + name;
    if (mod === 'uturn') return 'استدر للخلف';
    if (t === 'merge') return 'اندمج ' + (DIR[mod] || 'للأمام') + name;
    if (t === 'fork') return 'خذ المسار ' + (mod === 'left' || mod === 'slight left' ? 'الأيسر' : mod === 'right' || mod === 'slight right' ? 'الأيمن' : 'الأوسط') + name;
    if (t === 'on ramp' || t === 'off ramp') return 'اتجه ' + (DIR[mod] || 'للأمام') + ' إلى المنحدر' + name;
    if (!mod || mod === 'straight') return 'استمر للأمام' + name;
    return 'انعطف ' + (DIR[mod] || '') + name;
  }

  /* ================= الصوت ================= */
  function speak(text) {
    if (!state.voice || !('speechSynthesis' in window)) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ar-SA';
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  $('voiceBtn').onclick = () => {
    state.voice = !state.voice;
    $('voiceBtn').classList.toggle('off', !state.voice);
    if (state.voice) speak('تم تشغيل الصوت');
  };

  /* ================= الملاحة ================= */
  async function keepAwake() {
    try { if (navigator.wakeLock) state.wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  }

  function startNav(simulate) {
    if (!state.route) return;
    const steps = state.route.legs[0].steps;
    steps.forEach((s) => { s._said = false; });
    state.navigating = true; state.stepIdx = 0; state.offCount = 0;
    state.follow = true; $('btnLocate').classList.add('on');
    $('top').hidden = true; $('nav').hidden = false;
    $('reportPanel').hidden = true;
    $('planActions').hidden = true; $('navActions').hidden = false;
    $('stepsBox').open = false;
    $('sheet').classList.add('navmode');
    hazardAlerted = {};
    keepAwake();
    if (simulate) startSim(); else startWatch();
    if (!simulate && !state.user) toast('جاري تحديد موقعك...');
    speak(arInstr(steps[0]));
    if (state.user) map.setView([state.user.lat, state.user.lng], 17);
    navUpdate();
  }

  function endNav(msg) {
    state.navigating = false;
    stopSim();
    $('nav').hidden = true; $('top').hidden = false;
    $('sheet').classList.remove('navmode');
    clearRoute();
    try { if (state.wake) { state.wake.release(); state.wake = null; } } catch (e) {}
    try { window.speechSynthesis.cancel(); } catch (e) {}
    if (msg) toast(msg, 4000);
  }

  function setArrow(step) {
    const svg = $('navArrow');
    const mod = step.maneuver.modifier;
    let rot = ROT[mod] !== undefined ? ROT[mod] : 0;
    if (step.maneuver.type === 'arrive') rot = 0;
    svg.style.transform = 'rotate(' + rot + 'deg)';
  }

  function navUpdate() {
    if (!state.navigating || !state.route || !state.user) return;
    const steps = state.route.legs[0].steps;
    const p = [state.user.lat, state.user.lng];

    // السرعة
    const kmh = state.user.speed ? Math.round(state.user.speed * 3.6) : 0;
    $('spd').textContent = kmh;

    // التقدّم بالخطوات
    let idx = state.stepIdx;
    let up = steps[idx + 1];
    if (!up) return;
    let d = haversine(p, [up.maneuver.location[1], up.maneuver.location[0]]);
    if (d < 25) {
      if (idx + 1 >= steps.length - 1) { speak('وصلت إلى وجهتك'); endNav('وصلت إلى وجهتك'); return; }
      state.stepIdx = ++idx;
      up = steps[idx + 1];
      d = haversine(p, [up.maneuver.location[1], up.maneuver.location[0]]);
    }

    // اللافتة
    $('navDist').textContent = fmtDist(d);
    $('navText').textContent = arInstr(up);
    setArrow(up);

    // تنبيه صوتي قبل المنعطف
    if (d < 300 && !up._said) {
      up._said = true;
      speak('بعد ' + (d < 1000 ? Math.round(d / 10) * 10 + ' متر' : (d / 1000).toFixed(1) + ' كيلومتر') + '، ' + arInstr(up));
    }

    // المتبقي
    let remD = d, remT = 0;
    for (let j = idx + 1; j < steps.length; j++) { remD += steps[j].distance; remT += steps[j].duration; }
    $('sumTime').textContent = fmtTime(remT || 60);
    $('sumDist').textContent = fmtDist(remD);
    $('sumEta').textContent = 'الوصول ' + fmtClock(remT);

    // خروج عن المسار
    if (!state.sim) {
      if (distToRoute(p) > 70) {
        if (++state.offCount >= 3 && !state.rerouting) reroute();
      } else state.offCount = 0;
    }

    hazardCheck(p);
  }

  async function reroute() {
    state.rerouting = true; state.offCount = 0;
    toast('طلعت عن الطريق، أعيد الحساب...');
    speak('أعيد حساب الطريق');
    try {
      const route = await fetchRoute([state.user.lat, state.user.lng], [state.dest.lat, state.dest.lng]);
      route.legs[0].steps.forEach((s) => { s._said = false; });
      drawRoute(route);
      state.stepIdx = 0;
    } catch (e) { toast('ما كدرت أعيد حساب الطريق'); }
    state.rerouting = false;
  }

  /* ---------- وضع التجربة (يحاكي القيادة على المسار) ---------- */
  function densify(coords, stepM) {
    const out = [];
    for (let i = 0; i < coords.length - 1; i++) {
      const a = coords[i], b = coords[i + 1];
      const n = Math.max(1, Math.ceil(haversine(a, b) / stepM));
      for (let k = 0; k < n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
    }
    out.push(coords[coords.length - 1]);
    return out;
  }
  function startSim() {
    const pts = densify(state.coords, 8);
    let i = 0;
    state.sim = setInterval(() => {
      if (i >= pts.length - 1) { stopSim(); return; }
      const a = pts[i], b = pts[Math.min(i + 1, pts.length - 1)];
      onPosition(a[0], a[1], bearing(a, b), 20); // 20 م/ث تقريباً 72 كم/س
      i++;
    }, 400);
  }
  function stopSim() { if (state.sim) { clearInterval(state.sim); state.sim = null; } }

  $('startBtn').onclick = () => startNav(false);
  $('simBtn').onclick = () => startNav(true);
  $('cancelBtn').onclick = () => clearRoute();
  $('endBtn').onclick = () => endNav('انتهت الملاحة');

  /* ================= البلاغات (مثل Waze) ================= */
  const HZ = {
    traffic:  { label: 'زحمة سير',      color: '#e8590c', glyph: '≋' },
    accident: { label: 'حادث',          color: '#c92a2a', glyph: '!' },
    police:   { label: 'نقطة تفتيش',    color: '#1971c2', glyph: '★' },
    pothole:  { label: 'حفرة أو مطب',   color: '#6f5b3e', glyph: '◆' },
    closed:   { label: 'طريق مغلق',     color: '#212529', glyph: '✕' }
  };
  const hazardLayer = L.layerGroup().addTo(map);
  let hazards = [];
  let hazardAlerted = {};
  let lastSig = '';
  const DB_URL = 'https://daliny-map-default-rtdb.asia-southeast1.firebasedatabase.app';
  const HZ_TTL = 3 * 3600 * 1000; // البلاغ يبقى 3 ساعات

  function validHazard(h) {
    return h && HZ[h.type] && typeof h.lat === 'number' && typeof h.lng === 'number' && typeof h.t === 'number';
  }

  // تحميل البلاغات المشتركة من قاعدة البيانات
  async function loadHazards(silent) {
    try {
      const r = await fetch(DB_URL + '/hazards.json');
      if (!r.ok) throw new Error('http ' + r.status);
      const data = (await r.json()) || {};
      const now = Date.now(), list = [];
      Object.keys(data).forEach((id) => {
        const h = data[id];
        if (!validHazard(h)) return;
        if (now - h.t > HZ_TTL) { // بلاغ قديم: نمسحه من القاعدة
          fetch(DB_URL + '/hazards/' + id + '.json', { method: 'DELETE' }).catch(() => {});
          return;
        }
        h.id = id; list.push(h);
      });
      const sig = list.map((h) => h.id).sort().join(',');
      if (sig !== lastSig) { lastSig = sig; hazards = list; drawHazards(); }
    } catch (e) {
      if (!silent) toast('ما كدرت أحمّل بلاغات الآخرين، تأكد من الإنترنت', 4000);
    }
  }

  function drawHazards() {
    hazardLayer.clearLayers();
    hazards.forEach((h) => {
      const def = HZ[h.type];
      const icon = L.divIcon({
        className: '', iconSize: [30, 30], iconAnchor: [15, 15],
        html: '<div class="hz" style="background:' + def.color + '">' + def.glyph + '</div>'
      });
      const m = L.marker([h.lat, h.lng], { icon: icon }).addTo(hazardLayer);
      const box = document.createElement('div');
      const mins = Math.max(1, Math.round((Date.now() - h.t) / 60000));
      box.innerHTML = '<b>' + def.label + '</b><br><small>قبل ' + mins + ' دقيقة</small><br>';
      const del = document.createElement('button'); del.textContent = 'انتهى / حذف';
      del.onclick = async () => {
        map.closePopup();
        try {
          const r = await fetch(DB_URL + '/hazards/' + h.id + '.json', { method: 'DELETE' });
          if (!r.ok) throw new Error('http ' + r.status);
          hazards = hazards.filter((x) => x.id !== h.id);
          drawHazards();
        } catch (e) { toast('ما كدرت أحذف البلاغ، جرّب مرة ثانية'); }
      };
      box.appendChild(del);
      m.bindPopup(box);
    });
  }

  const grid = $('hzGrid');
  Object.keys(HZ).forEach((k) => {
    const b = document.createElement('button');
    b.innerHTML = '<i style="background:' + HZ[k].color + '">' + HZ[k].glyph + '</i>' + HZ[k].label;
    b.onclick = async () => {
      const pos = state.user ? [state.user.lat, state.user.lng] : [map.getCenter().lat, map.getCenter().lng];
      const rec = { type: k, lat: pos[0], lng: pos[1], t: Date.now() };
      $('reportPanel').hidden = true;
      try {
        const r = await fetch(DB_URL + '/hazards.json', { method: 'POST', body: JSON.stringify(rec) });
        if (!r.ok) throw new Error('http ' + r.status);
        const j = await r.json();
        rec.id = j.name;
        hazards.push(rec);
        drawHazards();
        toast('انرسل البلاغ للجميع: ' + HZ[k].label);
      } catch (e) { toast('ما انرسل البلاغ، تأكد من الإنترنت', 4000); }
    };
    grid.appendChild(b);
  });
  $('btnReport').onclick = () => { $('reportPanel').hidden = !$('reportPanel').hidden; };
  loadHazards(false);
  setInterval(() => { if (!document.hidden) loadHazards(true); }, 20000);

  function hazardCheck(p) {
    hazards.forEach((h) => {
      if (hazardAlerted[h.id]) return;
      const d = haversine(p, [h.lat, h.lng]);
      if (d < 350 && distToRoute([h.lat, h.lng]) < 60) {
        hazardAlerted[h.id] = true;
        const msg = HZ[h.type].label + ' أمامك بعد ' + Math.round(d / 10) * 10 + ' متر';
        toast(msg, 4500); speak(msg);
      }
    });
  }

  /* ================= بداية ================= */
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideResults(); });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  // لو المستخدم سمح بالموقع سابقاً نبدأ بدون ما نزعجه
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then((r) => {
      if (r.state === 'granted') { startWatch(); }
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
